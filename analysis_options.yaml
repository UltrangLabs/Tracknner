include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    avoid_dynamic_calls: error # Prohíbe el uso de 'any' (dynamic)
    always_declare_return_types: error # Obliga a tipar retornos
    always_use_package_imports: error # Obliga rutas absolutas, prohíbe ../
    curly_braces_in_flow_control_structures: error # Exige llaves siempre
    prefer_const_constructors: error # Calidad crítica en Flutter
    prefer_const_declarations: error # Equivalente a tu exigencia de inmutabilidad
    avoid_classes_with_only_static_members: error # Antipatrón en Dart (contrario a tu regla TS)

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # --- NOMENCLATURA ---
    # Obliga variables y funciones en lowerCamelCase y clases en PascalCase
    non_constant_identifier_names: true
    camel_case_types: true

    # --- ESTRUCTURA Y FLUJO ---
    always_declare_return_types: true
    #always_use_package_imports: true
    curly_braces_in_flow_control_structures: true

    # --- CALIDAD Y MODERNIDAD ---
    # Equivalente a tu regla de preferir for-of para colecciones
    prefer_iterable_whereType: true
    prefer_foreach: true

    # Exige inmutabilidad (variables const/final en lugar de var/let)
    prefer_final_locals: true
    prefer_final_in_for_each: true

    # Prohíbe el uso de funciones de alto coste si hay alternativas nativas
    prefer_is_empty: true
    prefer_is_not_empty: true

    prefer_relative_imports: true

    # --- DART SPECIFIC ---
    avoid_classes_with_only_static_members: true
    avoid_print: true

    # --- ORDERING ---
    directives_ordering: true
